<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Squircle Icon Container -->
  <rect x="20" y="20" width="230" height="230" rx="52" fill="url(#bg-grad)" stroke="#3F3F46" stroke-width="3" filter="url(#shadow)"/>

  <!-- Speed Motion Lines -->
  <rect x="42" y="110" width="24" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="34" y="132" width="32" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="46" y="154" width="20" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Paper Document Body -->
  <path d="M 95 60 L 175 60 L 205 90 L 205 210 Q 205 218 197 218 L 95 218 Q 87 218 87 210 L 87 68 Q 87 60 95 60 Z" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Folded Corner -->
  <path d="M 175 60 L 175 90 L 205 90 Z" fill="#E4E4E7"/>

  <!-- Document Lines -->
  <rect x="165" y="125" width="26" height="7" rx="3.5" fill="#18181B"/>
  <rect x="165" y="145" width="26" height="7" rx="3.5" fill="#18181B"/>
  <rect x="165" y="165" width="26" height="7" rx="3.5" fill="#18181B"/>

  <!-- Yellow Lightning Bolt Overlay -->
  <path d="M 142 75 L 105 138 L 132 138 L 115 198 L 168 126 L 140 126 Z" fill="url(#bolt-grad)"/>

  <!-- Text: "Note" (White for GitHub visibility) -->
  <text x="280" y="172" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Note</text>

  <!-- Text: "Sprint" (Yellow) -->
  <text x="535" y="172" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="900" fill="#F59E0B" letter-spacing="-2">Sprint</text>

  <!-- Badge: [AI] (White Border & White Text) -->
  <rect x="835" y="98" font-family="sans-serif" width="68" height="58" rx="14" fill="#09090B" stroke="#FFFFFF" stroke-width="4.5"/>
  <text x="847" y="141" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">AI</text>
</svg>
